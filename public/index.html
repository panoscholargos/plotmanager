    await loadPlots(); if (CUR) renderDetail(); renderMarkers(); toast('Αποθηκεύτηκε', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

// --- αποθήκευση / διαγραφή ---
const PLOT_FIELDS = ['code','title','address','municipality','area','price','kaek','description','dropbox','lat','lng',
  'contact_name','contact_phone','contact_email','contact_type','crit_checked','crit_distance','crit_road_width','crit_rejected','crit_notes',
  'zone','sd','coverage','max_height','max_floors','frontage','min_area','min_frontage','units','terms_notes',
  'phase','dist_center','dist_sea','road_width_plan','road_width_site','access_metro','access_tram','access_bus','access_notes',
  'market_notes','new_sale_m2','build_cost_m2','other_costs','tasks','checks','scores','crit_dist_sea',
  'ot','pol_enotita','pe_number','pe_decision','pe_date','pe_registry','pe_notes','project','markers'];
let SAVING = false;
async function savePlot(force) {
  if (SAVING || !CUR) return;
  if (CUR.dropbox && !/^https?:\/\//i.test(CUR.dropbox)) return toast('Ο σύνδεσμος Dropbox πρέπει να ξεκινά με https://', 'err');
  if (document.querySelector('#tabBody input.invalid')) return toast('Διορθώστε τα πεδία με κόκκινο περίγραμμα (μη έγκυρος ή αρνητικός αριθμός, βαθμός πάνω από 10, κάλυψη πάνω από 100%).', 'err');
  if ((num(CUR.lat) === null) !== (num(CUR.lng) === null)) return toast('Συμπληρώστε και τις δύο συντεταγμένες ή καμία.', 'err');
  const body = { base_rev: CUR.rev || 0, force: !!force };
  const sent = {};                                  // στιγμιότυπο, για να μη χαθεί ό,τι γραφτεί όσο περιμένουμε
  for (const k of PLOT_FIELDS) if (k in CUR) { body[k] = CUR[k] === undefined ? null : CUR[k]; sent[k] = JSON.stringify(body[k]); }
  const id = CUR.id;
  let retry = false, reload = false;
  SAVING = true;
  try {
    const p = await api('plots/' + id, { method: 'PUT', body });
    if (!CUR || CUR.id !== id) return;              // στο μεταξύ άνοιξε άλλο οικόπεδο
    // πεδία που άλλαξαν όσο γινόταν η αποθήκευση: κρατάμε τη νεότερη τιμή και μένουν «μη αποθηκευμένα»
    const later = Object.keys(sent).filter(k => JSON.stringify(CUR[k] === undefined ? null : CUR[k]) !== sent[k]);
    const keep = {}; for (const k of later) keep[k] = CUR[k];
    CUR = { ...CUR, ...p, ...keep }; DIRTY = later.length > 0;
    if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
    if (CUR.project !== PROJ) {                     // μεταφέρθηκε σε άλλο έργο
      const to = PROJECTS.find(x => x.id === CUR.project);
      DIRTY = false; await loadPlots(); renderList(); return toast(`Το οικόπεδο μεταφέρθηκε στο έργο «${to ? to.name : ''}»`, 'ok');
    }
    await loadPlots();
    if (!CUR || CUR.id !== id) return;              // άνοιξε άλλο οικόπεδο όσο ανανεωνόταν η λίστα
    if (DIRTY) { markDirty(); renderMarkers(); toast('Αποθηκεύτηκε. Οι αλλαγές που κάνατε στο μεταξύ θέλουν νέα Αποθήκευση.'); }
    else { renderDetail(); renderMarkers(); toast('Αποθηκεύτηκε', 'ok'); }
  } catch (e) {
    if (e.status === 409) {
      const who = e.data && e.data.updated_by ? ` (${e.data.updated_by}, ${fmtDT(e.data.updated)})` : '';
      if (confirm(`${e.message}${who}\n\nOK: να αποθηκευτούν οι δικές σας αλλαγές πάνω από τις άλλες.\nΆκυρο: να φορτωθεί η νέα έκδοση (οι αλλαγές σας χάνονται).`)) retry = true;
      else reload = true;
    } else toast(e.message, 'err');
  } finally { SAVING = false; }
  if (retry) return savePlot(true);
  if (reload && CUR && CUR.id === id) { DIRTY = false; return openPlot(id); }
}
async function deletePlot() {
  if (!confirm(`Οριστική διαγραφή του οικοπέδου «${CUR.title}» μαζί με ημερολόγιο και παρατηρήσεις;`)) return;
  try { await api('plots/' + CUR.id, { method: 'DELETE' }); DIRTY = false; await loadPlots(); renderList(); toast('Διαγράφηκε', 'ok'); }
  catch (e) { toast(e.message, 'err'); }
}
window.addEventListener('beforeunload', (e) => { if (DIRTY) { e.preventDefault(); e.returnValue = ''; } });

// ===================== MODALS =====================
function openModal(html, cls = '') { $('modalBox').className = cls; $('modalBox').innerHTML = html; $('modal').classList.remove('hidden'); }
function closeModal() { $('modal').classList.add('hidden'); }

// --- Βοήθεια: το help.md (οδηγίες χρήσης, χωρίς τεχνικά στοιχεία) εμφανίζεται μέσα στην εφαρμογή ---
// Μικρός μετατροπέας Markdown (επικεφαλίδες, λίστες, πίνακες, κώδικας, έντονα, σύνδεσμοι), χωρίς εξωτερική βιβλιοθήκη.
function mdToHtml(src) {
  const inline = (t) => esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+|mailto:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])([\w.+-]+@[\w-]+\.[\w.-]+\w)/g, '$1<a href="mailto:$2">$2</a>');
  const lines = src.replace(/\r/g, '').split('\n'), out = [];
  const stack = [];                                   // ανοιχτές λίστες: { ind, tag }
  const closeTo = (ind) => { while (stack.length && stack[stack.length - 1].ind >= ind) out.push(`</li></${stack.pop().tag}>`); };
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i], m = ln.match(/^(\s*)(.*)$/), ind = m[1].length, t = m[2];
    if (t.startsWith('```')) {                         // μπλοκ κώδικα
      const buf = []; while (++i < lines.length && !lines[i].trim().startsWith('```')) buf.push(lines[i]);
      closeTo(0); out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`); continue;
    }
    if (!t) { continue; }
    if (t.startsWith('|')) {                           // πίνακας
      const rows = []; i--;
      while (++i < lines.length && lines[i].trim().startsWith('|')) rows.push(lines[i].trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim()));
      i--;
      const body = rows.filter(r => !r.every(c => /^:?-+:?$/.test(c)));
      const tbl = `<table>${body.map((r, k) => `<tr>${r.map(c => k ? `<td>${inline(c)}</td>` : `<th>${inline(c)}</th>`).join('')}</tr>`).join('')}</table>`;
      if (stack.length && ind > 0) out.push(tbl); else { closeTo(0); out.push(tbl); }
      continue;
    }
    if (/^-{3,}$/.test(t) && ind === 0) { closeTo(0); out.push('<hr>'); continue; }
    const h = t.match(/^(#{1,3})\s+(.*)$/);
    if (h && ind === 0) { closeTo(0); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    const li = t.match(/^([-*]|\d+\.)\s+(.*)$/);
    if (li) {
      const tag = /\d/.test(li[1]) ? 'ol' : 'ul';
      closeTo(ind + 1);
      const top = stack[stack.length - 1];
      if (!top || top.ind < ind) { stack.push({ ind, tag }); out.push(`<${tag}><li>`); }
      else out.push('</li><li>');
      out.push(inline(li[2])); continue;
    }
    if (stack.length && ind > 0) { out.push(' ' + inline(t)); continue; }   // συνέχεια στοιχείου λίστας
    closeTo(0);
    out.push(`<p>${inline(t)}</p>`);
  }
  closeTo(0);
  return out.join('');
}
async function openHelp() {
  openModal(`<div class="ph"><h2>Βοήθεια</h2><button class="btn sm" onclick="closeModal()">✕</button></div><div class="mb md" id="helpBody">Φόρτωση…</div>`, 'help');
  try {
    const r = await fetch('/help.md', { cache: 'no-cache' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    $('helpBody').innerHTML = mdToHtml(await r.text());
  } catch (e) {
    $('helpBody').innerHTML = `<p class="bad">Δεν φορτώθηκε η βοήθεια (${esc(e.message)}). Ελέγξτε τη σύνδεση και δοκιμάστε ξανά.</p>`;
  }
}

// --- Χρήστες (admin) ---
async function openUsers() {
  openModal(`<div class="ph"><h2>Χρήστες</h2><button class="btn sm" onclick="closeModal()">✕</button></div><div class="mb" id="usersBody">Φόρτωση…</div>`);
  await renderUsers();
}
async function renderUsers() {
  let list;
  try { list = USERS_CACHE = await api('users'); } catch (e) { $('usersBody').innerHTML = `<span class="bad">${esc(e.message)}</span>`; return; }
  $('usersBody').innerHTML = `
  <fieldset><legend>Νέος χρήστης</legend><div class="grid">
    <label class="fld"><span>Όνομα χρήστη (λατινικά)</span><input type="text" id="nuUser" autocapitalize="none"></label>
    <label class="fld"><span>Ονοματεπώνυμο</span><input type="text" id="nuName"></label>
    <label class="fld"><span>Κωδικός (≥ 6)</span><input type="text" id="nuPass"></label>
    <label class="fld"><span>Ρόλος</span><select id="nuRole"><option value="user">Χρήστης</option><option value="admin">Διαχειριστής</option></select></label>
    <div class="fld full"><span>Πρόσβαση σε έργα</span><div class="pchips">${PROJECTS.map(p => `<label><input type="checkbox" class="nuProj" value="${esc(p.id)}" ${p.id === PROJ ? 'checked' : ''}>${esc(p.name)}</label>`).join('')}</div></div>
    <div class="full row" style="justify-content:flex-end"><button class="btn primary sm" onclick="addUser()">Δημιουργία</button></div>
  </div></fieldset>
  ${ME.env ? '<div class="note" style="margin-bottom:8px">Είστε συνδεδεμένος ως κύριος διαχειριστής (ορίζεται από τις ρυθμίσεις του Netlify και δεν εμφανίζεται εδώ).</div>' : ''}
  <table class="users"><tr><th>Χρήστης</th><th>Όνομα</th><th>Ρόλος</th><th>Έργα</th><th>Ενεργός</th><th></th></tr>
  ${list.map(u => `<tr>
    <td>${esc(u.username)}</td><td>${esc(u.name)}</td>
    <td><select onchange="patchUser('${esc(u.username)}',{role:this.value})"><option value="user" ${u.role === 'user' ? 'selected' : ''}>Χρήστης</option><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>Διαχειριστής</option></select></td>
    <td>${u.role === 'admin' ? '<span class="note">όλα</span>' : `<div class="pchips">${PROJECTS.map(p => `<label><input type="checkbox" ${(u.projects || []).includes(p.id) ? 'checked' : ''} onchange="toggleUserProj('${esc(u.username)}','${esc(p.id)}',this.checked)">${esc(p.name)}</label>`).join('')}</div>`}</td>
    <td><input type="checkbox" ${u.active ? 'checked' : ''} onchange="patchUser('${esc(u.username)}',{active:this.checked})"></td>
    <td class="row"><button class="btn sm" onclick="resetPw('${esc(u.username)}')">Κωδικός</button>
      <button class="btn danger sm" onclick="delUser('${esc(u.username)}')">✕</button></td></tr>`).join('') || '<tr><td colspan="6" class="note">Κανένας χρήστης</td></tr>'}
  </table>`;
}
async function addUser() {
  try {
    await api('users', { method: 'POST', body: { username: $('nuUser').value, name: $('nuName').value, password: $('nuPass').value, role: $('nuRole').value, projects: [...document.querySelectorAll('.nuProj:checked')].map(x => x.value) } });
    toast('Ο χρήστης δημιουργήθηκε', 'ok'); await renderUsers();
  } catch (e) { toast(e.message, 'err'); }
}
async function patchUser(u, body) {
  try {
    await api('users/' + encodeURIComponent(u), { method: 'PATCH', body }); toast('Ενημερώθηκε', 'ok');
    if ('role' in body) await renderUsers();         // ο ρόλος αλλάζει τη στήλη «Έργα» (διαχειριστής: όλα)
  } catch (e) { toast(e.message, 'err'); await renderUsers(); }
}
let USERS_CACHE = [];
async function toggleUserProj(u, pid, on) {
  const rec = USERS_CACHE.find(x => x.username === u); if (!rec) return;
  const set = new Set(rec.projects || []); on ? set.add(pid) : set.delete(pid);
  rec.projects = [...set];
  await patchUser(u, { projects: rec.projects });
}
async function resetPw(u) {
  // ο δικός σας κωδικός αλλάζει με επιβεβαίωση του τρέχοντος (και η σύνδεση συνεχίζει με νέο token)
  if (u === ME.username) { closeModal(); return openPassword(); }
  const pw = prompt(`Νέος κωδικός για τον χρήστη «${u}» (τουλάχιστον 6 χαρακτήρες):`);
  if (!pw) return; await patchUser(u, { password: pw });
}
async function delUser(u) {
  if (!confirm(`Διαγραφή του χρήστη «${u}»; Οι παρατηρήσεις του παραμένουν.`)) return;
  try { await api('users/' + encodeURIComponent(u), { method: 'DELETE' }); toast('Διαγράφηκε', 'ok'); await renderUsers(); }
  catch (e) { toast(e.message, 'err'); }
}

// --- Αλλαγή κωδικού ---
function openPassword() {
  if (ME.env) return toast('Ο κωδικός του κύριου διαχειριστή αλλάζει από τη μεταβλητή ADMIN_PASS στο Netlify');
  openModal(`<div class="ph"><h2>Αλλαγή κωδικού</h2><button class="btn sm" onclick="closeModal()">✕</button></div>
  <div class="mb"><div class="grid">
    <label class="fld full"><span>Τρέχων κωδικός</span><input type="password" id="pwOld" autocomplete="current-password"></label>
    <label class="fld full"><span>Νέος κωδικός (≥ 6)</span><input type="password" id="pwNew" autocomplete="new-password"></label>
    <div class="full row" style="justify-content:flex-end"><button class="btn primary sm" onclick="changePw()">Αλλαγή</button></div>
  </div></div>`);
}
async function changePw() {
  try {
    const d = await api('password', { method: 'POST', body: { old: $('pwOld').value, new: $('pwNew').value } });
    TOKEN = d.token; localStorage.setItem('pm_token', TOKEN); closeModal(); toast('Ο κωδικός άλλαξε', 'ok');
  } catch (e) { toast(e.message, 'err'); }
}

// ===================== ΕΓΚΑΤΑΣΤΑΣΗ (PWA) =====================
let installEvt = null;
const showInstall = (on) => document.querySelectorAll('.installBtn').forEach(b => b.classList.toggle('hidden', !on));
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; showInstall(true); });
window.addEventListener('appinstalled', () => { installEvt = null; showInstall(false); toast('Η εφαρμογή εγκαταστάθηκε', 'ok'); });
async function installApp() {
  if (!installEvt) return;
  installEvt.prompt();
  try { await installEvt.userChoice; } catch {}
  installEvt = null; showInstall(false);
}
(() => {   // iPhone/iPad: δεν υπάρχει κουμπί εγκατάστασης, μόνο μέσω Κοινοποίησης
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (ios && !standalone) $('iosHint').classList.remove('hidden');
})();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));

boot();
</script>
