<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlotManager</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#161b22">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PlotManager">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2128; --border:#30363d; --text:#c9d1d9; --muted:#8b949e;
  --accent:#58a6ff; --green:#3fb950; --red:#f85149; --orange:#d29922; --purple:#a371f7; --input:#0d1117; --hover:#21262d;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",sans-serif}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- κουμπιά (outline) ---------- */
.btn{background:transparent;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:5px 12px;cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--hover);border-color:#8b949e}
.btn.primary{border-color:var(--accent);color:var(--accent)} .btn.primary:hover{background:rgba(88,166,255,.12)}
.btn.success{border-color:var(--green);color:var(--green)} .btn.success:hover{background:rgba(63,185,80,.12)}
.btn.danger{border-color:var(--red);color:var(--red)} .btn.danger:hover{background:rgba(248,81,73,.12)}
.btn.sm{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}

/* ---------- topbar ---------- */
#topbar{height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.3px}
.logo svg{width:24px;height:24px}
.sep{width:1px;height:24px;background:var(--border)}
.section-name{color:var(--muted)}
#projSel{background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:4px 8px;max-width:260px;min-width:0;font-weight:600}
.projbox{display:flex;align-items:center;gap:6px;min-width:0}
.plist{display:grid;gap:6px}
.pitem{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:6px;padding:7px 10px;background:var(--panel2)}
.pitem .nm{flex:1;min-width:0}
.pchips{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px}
.pchips label{display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.role{font-size:11px;border:1px solid var(--border);border-radius:10px;padding:0 7px}
.role.admin{border-color:var(--accent);color:var(--accent)}
#panelToggle{display:none}

/* ---------- κύρια διάταξη ---------- */
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
#topbar{flex:none}
#main{display:flex;flex:1;min-height:0;position:relative}
.nav{display:flex;gap:4px}
.navbtn{background:none;border:1px solid transparent;color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer}
.navbtn:hover{color:var(--text);background:var(--hover)}
.navbtn.on{color:var(--text);border-color:var(--border);background:var(--panel2)}
.navbtn{white-space:nowrap} .navbtn .lbl-s{display:none}
#topbar{min-width:0;overflow:hidden}
#mapTools{position:absolute;top:10px;left:56px;z-index:500;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;width:250px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#mapTools .mt-title{font-weight:600;margin-bottom:2px}
.legend{display:grid;gap:3px;margin:6px 0 10px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;border:1px solid #0d1117;vertical-align:-1px}
#mapTools .btn{width:100%}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--text);border:1px solid var(--border)}
.leaflet-popup-content{margin:10px 12px;font-size:13px;line-height:1.5}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
#panel{width:480px;min-width:340px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#map{flex:1;background:#0b0f14;position:relative;z-index:0}
#map.picking{cursor:crosshair}
.leaflet-container{background:#0b0f14}
.leaflet-tooltip{background:var(--panel);color:var(--text);border:1px solid var(--border)}
/* σημεία με ετικέτα */
.poi-lbl{background:rgba(255,255,255,.94)!important;color:#1f2328!important;border:1px solid #8c959f!important;border-radius:3px;
  padding:0 6px!important;font-size:11.5px;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.35)!important;white-space:nowrap}
.poi-lbl:before{display:none}
.poi-ico svg{display:block;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.55))}
.poi-list{display:grid;gap:6px;margin-top:8px}
.poi-row{display:grid;grid-template-columns:12px 1fr 92px auto auto;gap:6px;align-items:center}
.poi-row.u{grid-template-columns:12px 1fr auto auto}
.poi-dot{width:12px;height:12px;border-radius:50%;border:1px solid #0d1117}
.poi-row .note{white-space:nowrap}
.leaflet-control-layers{background:var(--panel)!important;color:var(--text)!important;border:1px solid var(--border)!important}

.ph{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.ph h2{font-size:15px;margin:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbody{flex:1;overflow:auto;padding:12px}
.pfoot{border-top:1px solid var(--border);padding:8px 12px;display:flex;gap:8px;align-items:center;background:var(--panel2)}
.dirty{color:var(--orange);font-size:12px}

/* tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none}
.tab{padding:8px 11px;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-size:13px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}
.tab .cnt{font-size:11px;background:var(--hover);border-radius:8px;padding:0 6px;margin-left:4px}

/* λίστα φακέλων */
.filters{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.filters input{flex:1;min-width:140px}
.chip{border:1px solid var(--border);border-radius:14px;padding:2px 10px;font-size:12px;cursor:pointer;background:none;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--accent)}
.folder{display:flex;gap:10px;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer;background:var(--panel2)}
.folder:hover{border-color:#8b949e}
.folder.sel{border-color:var(--accent)}
.folder .ico{font-size:22px;line-height:1}
.folder .t{font-weight:600}
.folder .s{color:var(--muted);font-size:12px}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.bdg{font-size:11px;border:1px solid var(--border);border-radius:10px;padding:0 7px;color:var(--muted)}
.bdg.g{border-color:var(--green);color:var(--green)}
.bdg.r{border-color:var(--red);color:var(--red)}
.bdg.o{border-color:var(--orange);color:var(--orange)}
.bdg.b{border-color:var(--accent);color:var(--accent)}
.bdg.p{border-color:var(--purple);color:var(--purple)}
/* εργασίες σύμβασης */
.task{border-left:3px solid var(--border);background:var(--panel2);border-radius:0 6px 6px 0;padding:7px 9px;margin-bottom:6px}
.task.st-progress{border-left-color:var(--orange)} .task.st-done{border-left-color:var(--green)} .task.st-na{opacity:.55}
.task-h{font-size:13px;margin-bottom:4px} .task-h b{color:var(--accent);margin-right:4px}
.task-f{display:grid;grid-template-columns:1fr 1fr 74px;gap:6px;margin-bottom:5px}
.task-f.u{grid-template-columns:1fr 1fr}
fieldset.locked{opacity:.6}
.prog{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:12px;margin-bottom:12px}
.bar{height:6px;background:var(--hover);border-radius:3px;overflow:hidden} .bar i{display:block;height:100%;background:var(--green)}
/* λίστα ελέγχου Γ.3 */
.chkrow{display:grid;grid-template-columns:1fr 130px;gap:4px 8px;padding:6px 0;border-bottom:1px solid var(--border);align-items:center}
.chkrow input,.chkrow .note{grid-column:1/-1}
.chkrow.cs-problem .cl{color:var(--red)} .chkrow.cs-ok .cl{color:var(--green)} .chkrow.cs-na .cl{color:var(--muted)}
.banner{border:1px solid var(--orange);color:var(--orange);border-radius:6px;padding:6px 10px;margin-bottom:10px;font-size:13px}
.chk.purple input{accent-color:var(--purple)} .chk.purple span{color:var(--purple);font-weight:600}
/* συγκριτικός πίνακας */
#compare{flex:1;min-width:0;overflow:auto;padding:12px}
.cmp-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.cmp-bar h2{font-size:16px;margin:0;margin-right:auto}
table.cmp{border-collapse:collapse;font-size:12.5px;white-space:nowrap}
table.cmp th{position:sticky;top:0;background:var(--panel);color:var(--muted);font-weight:400;text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);z-index:1}
table.cmp td{padding:6px 8px;border-bottom:1px solid var(--border)}
table.cmp td.n{text-align:right;font-variant-numeric:tabular-nums}
table.cmp td.warn{color:#d29922}
table.cmp tr:hover td{background:var(--hover);cursor:pointer}
table.cmp tr.rj td{opacity:.55}
.empty{color:var(--muted);text-align:center;padding:30px 10px}

/* φόρμες */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{font-size:12px;color:var(--muted)}
input[type=text],input[type=password],input[type=date],input[type=url],input[type=tel],input[type=email],input:not([type]),select,textarea{
  background:var(--input);border:1px solid var(--border);border-radius:6px;padding:6px 8px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
input.invalid{border-color:var(--red)!important}
input:disabled,select:disabled,textarea:disabled{opacity:.85;color:var(--text);background:var(--panel2)}
textarea{resize:vertical}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--accent)}
.chk.red input{accent-color:var(--red)} .chk.red span{color:var(--red);font-weight:600}
.radios{display:flex;gap:16px;padding:6px 0}
.radios label{display:flex;gap:6px;align-items:center;cursor:pointer}
fieldset{border:1px solid var(--border);border-radius:8px;padding:10px;margin:0 0 12px}
legend{color:var(--muted);font-size:12px;padding:0 6px;text-transform:uppercase;letter-spacing:.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* υπολογισμοί */
.calc{width:100%;border-collapse:collapse;font-size:13px}
.calc td{padding:5px 6px;border-bottom:1px solid var(--border)}
.calc td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.calc tr.h td{text-align:left;color:var(--muted);font-weight:400;font-size:12px;text-transform:uppercase}
.note{font-size:12px;color:var(--muted)}
.ok{color:var(--green)} .bad{color:var(--red)}

/* ημερολόγιο */
.ev{border-left:3px solid var(--accent);background:var(--panel2);border-radius:0 6px 6px 0;padding:8px 10px;margin-bottom:8px}
.ev.done{border-left-color:var(--green);opacity:.8}
.ev .d{font-size:12px;color:var(--muted)}
.ev .t{font-weight:600}
.ev .n{white-space:pre-wrap;margin-top:3px}

/* αρχεία */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.ph-item{position:relative;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--panel2)}
.ph-item img{width:100%;height:100px;object-fit:cover;display:block;cursor:pointer;background:#000}
.ph-item .cap{font-size:12px;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph-item .x{position:absolute;top:4px;right:4px;background:rgba(13,17,23,.85)}
.doc{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--border);border-radius:6px;margin-bottom:6px;background:var(--panel2)}
.doc a{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* παρατηρήσεις */
.rev{border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:8px;background:var(--panel2)}
.rev .hd{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.rev .hd b{color:var(--text)}
.rev .tx{white-space:pre-wrap;margin-top:4px}
.ro{white-space:pre-wrap;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:8px}

/* login / modal / toast */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:2000}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:22px;width:min(360px,92vw)}
.card h1{font-size:18px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.card .sub{color:var(--muted);margin-bottom:16px;font-size:13px}
.card .fld{margin-bottom:10px}
#modal{position:fixed;inset:0;background:rgba(1,4,9,.7);display:flex;align-items:center;justify-content:center;z-index:2100}  /* πάνω από τη φόρμα σύνδεσης (Βοήθεια) */
#modalBox{background:var(--panel);border:1px solid var(--border);border-radius:10px;width:min(720px,94vw);max-height:88vh;display:flex;flex-direction:column}
#modalBox .mb{padding:14px;overflow:auto}
/* κουμπί και παράθυρο βοήθειας */
.infoBtn{width:28px;height:28px;padding:0!important;border-radius:50%!important;background:#1f6feb!important;border-color:#388bfd!important;color:#fff!important;
  font:italic 700 15px Georgia,'Times New Roman',serif!important;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.infoBtn:hover{background:#388bfd!important}
#modalBox.help{width:min(900px,96vw)}
.md{font-size:14px;line-height:1.6;color:var(--text)}
.md h1{font-size:22px;margin:0 0 10px;border-bottom:1px solid var(--border);padding-bottom:8px}
.md h2{font-size:17px;margin:22px 0 8px;border-bottom:1px solid var(--border);padding-bottom:5px;color:#58a6ff}
.md h3{font-size:15px;margin:16px 0 6px}
.md p{margin:8px 0}.md ul,.md ol{margin:6px 0;padding-left:22px}.md li{margin:3px 0}
.md code{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:0 4px;font-size:12.5px}
.md pre{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:10px;overflow:auto;font-size:12.5px;line-height:1.45}
.md pre code{border:0;padding:0;background:none}
.md table{border-collapse:collapse;margin:8px 0;font-size:13px}.md th,.md td{border:1px solid var(--border);padding:4px 8px;text-align:left}
.md th{background:var(--bg)}.md a{color:#58a6ff}
.md hr{border:0;border-top:1px solid var(--border);margin:20px 0 8px}
table.users{width:100%;border-collapse:collapse;font-size:13px}
table.users th,table.users td{text-align:left;padding:6px;border-bottom:1px solid var(--border)}
table.users th{color:var(--muted);font-weight:400;font-size:12px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 14px;z-index:3000;max-width:90vw}
#toast.err{border-color:var(--red);color:var(--red)}
#toast.ok{border-color:var(--green)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2500;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
#lightbox img{max-width:96vw;max-height:92vh}

@media (max-width:820px){
  /* κινητό: δύο σειρές — 1) έργο + εικονίδια, 2) Λίστα / Χάρτης / Πίνακας σε όλο το πλάτος */
  body.ruler-on #mapTools{display:none}
  #topbar{gap:6px;padding:6px 8px;height:auto;flex-wrap:wrap;row-gap:6px}
  #topbar .logo{display:none}
  .projbox{flex:1;min-width:0} #projSel{max-width:none;width:100%;padding:5px 6px;font-size:14px}
  #topbar .spacer{display:none}
  .nav{order:10;flex:0 0 100%;display:flex;gap:4px}
  .nav .navbtn{flex:1;text-align:center;border-color:var(--border);padding:5px 4px}
  #topbar .sep,.who .role{display:none}
  .navbtn .lbl-l{display:none} .navbtn .lbl-s{display:inline}
  .nav{gap:2px;min-width:0}
  .task-f{grid-template-columns:1fr 74px} .task-f select{grid-column:1/-1}
  .task-f.u{grid-template-columns:1fr}
  .poi-row{grid-template-columns:12px 1fr 80px auto auto}
  #panelToggle{display:inline-block}
  .who .nm,.logo-text,.lbl{display:none}
  .navbtn{padding:4px 7px;font-size:13px}
  #mapTools{left:auto;right:10px;top:auto;bottom:24px;width:220px}
  #panel{position:absolute;top:0;bottom:0;left:0;width:100%;min-width:0;z-index:1000}
  #panel.collapsed{display:none}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login">
  <form class="card" onsubmit="doLogin(event)">
    <h1><img src="/favicon.svg" width="34" height="34" alt="">PlotManager</h1>
    <div class="sub">Επιλογή οικοπέδων για δόμηση</div>
    <label class="fld"><span>Όνομα χρήστη</span><input type="text" id="lgUser" autocomplete="username" autocapitalize="none" required></label>
    <label class="fld"><span>Κωδικός</span><input type="password" id="lgPass" autocomplete="current-password" required></label>
    <div class="row" style="justify-content:space-between;margin-top:6px">
      <span id="lgErr" class="bad" style="font-size:13px"></span>
      <button class="btn primary" id="lgBtn">Σύνδεση</button>
    </div>
    <div style="margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button type="button" class="btn sm infoBtn" onclick="openHelp()" title="Βοήθεια" aria-label="Βοήθεια">i</button>
      <button type="button" class="btn sm hidden installBtn" onclick="installApp()">⤓ Εγκατάσταση εφαρμογής</button>
      <span id="iosHint" class="note hidden">Για εγκατάσταση στο iPhone/iPad: Κοινοποίηση <b>⬆</b> → «Προσθήκη στην οθόνη Αφετηρίας».</span>
    </div>
  </form>
</div>

<svg style="display:none"><symbol id="logoIcon" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="1.6" stroke-linejoin="round">
  <path d="M2 20h20"/><path d="M3 20l3-6h12l3 6" stroke-dasharray="2 1.5"/><path d="M8 14V9l4-3.5L16 9v5"/><path d="M11 14v-2.5h2V14"/>
</symbol></svg>

<!-- ============ APP ============ -->
<div id="topbar">
  <button class="btn sm" id="panelToggle" onclick="togglePanel()">☰</button>
  <div class="logo"><img src="/favicon.svg" width="26" height="26" alt=""><span class="logo-text">PlotManager</span></div>
  <div class="sep"></div>
  <div class="projbox"><select id="projSel" title="Έργο" onchange="switchProject(this.value)"></select>
    <button class="btn sm hidden" id="projBtn" onclick="openProjects()" title="Διαχείριση έργων">⚙<span class="lbl"> Έργα</span></button></div>
  <div class="sep"></div>
  <div class="nav">
    <button class="navbtn on" data-v="plots" onclick="setView('plots')"><span class="lbl-l">Επιλογή Οικοπέδων</span><span class="lbl-s">Λίστα</span></button>
    <button class="navbtn" data-v="map" onclick="setView('map')">Χάρτης</button>
    <button class="navbtn" data-v="compare" onclick="setView('compare')"><span class="lbl-l">Συγκριτικός Πίνακας</span><span class="lbl-s">Πίνακας</span></button>
  </div>
  <div class="spacer"></div>

<script>
// ===================== ΡΥΘΜΙΣΕΙΣ =====================
const CFG = {
  center: [37.97, 23.73], zoom: 10,
  // WMS Κτηματολογίου (υπόβαθρο BASEMAP), ίδιο endpoint και layer με το mySimpleGIS
  ktimaWms: 'https://gis.ktimanet.gr/wms/wmsopen/wmsserver.aspx?',
  ktimaLayer: 'BASEMAP',
  // Προεπιλεγμένα κριτήρια σύμβασης (Γ.4). Κάθε έργο μπορεί να έχει δικά του (⚙ Έργα → Ρυθμίσεις, applyProjectSettings)
  contract: { center_km: 2, sea_km: 4, road_m: 8, house_min_m2: 170, house_max_m2: 220,
    // λόγος καθαρού προς μικτό εμβαδόν κατοικίας (τοίχοι, κλιμακοστάσιο, κοινόχρηστα)
    net_ratio: 0.85 },
};

// ===================== ΚΑΤΑΣΤΑΣΗ =====================
let TOKEN = localStorage.getItem('pm_token') || '';
let ME = null;
let PLOTS = [];
let CUR = null;          // πλήρες τρέχον οικόπεδο
let CUR_REVIEWS = [];
let TAB = 'info';
let FILTER = 'all';
let SEARCH = '';
let DIRTY = false;
let PICK = false;
let VIEW = 'plots';
let PROJECTS = [], PROJ = null;
let map, markerLayer, tempMarker, poiLayer, RULER = null;

const isAdmin = () => ME && ME.role === 'admin';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = (v) => { if (v === null || v === undefined || v === '') return null; const n = Number(String(v).replace(',', '.')); return Number.isFinite(n) ? n : null; };
// Ανάγνωση αριθμού που πληκτρολογεί ο χρήστης: δέχεται «285.000», «1.234,5», «7,5», «0.6».
// Οι συντεταγμένες (coord) διαβάζονται πάντα με τελεία ή κόμμα ως υποδιαστολή.
function parseNum(v, coord) {
  let s = String(v ?? '').trim().replace(/\s/g, '');
  if (s === '') return null;
  if (!coord) {
    if (/^-?[1-9]\d{0,2}(\.\d{3})+(,\d*)?$/.test(s)) s = s.replace(/\./g, '');      // 285.000 ή 1.234,5
    else if (/^-?[1-9]\d{0,2}(,\d{3})+\.\d+$/.test(s)) s = s.replace(/,/g, '');   // 1,234.5 (αγγλική μορφή)
  }
  const n = Number(s.replace(',', '.'));
  return Number.isFinite(n) ? n : NaN;
}
const fmt = (n, d = 2) => n === null || n === undefined || !Number.isFinite(n) ? '—' : n.toLocaleString('el-GR', { minimumFractionDigits: 0, maximumFractionDigits: d });
const fmtDate = (s) => {
  if (!s) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);           // ημερομηνία χωρίς ώρα: χωρίς μετατροπή ζώνης
  if (m) return `${m[3]}/${m[2]}/${m[1]}`;
  const d = new Date(s); return isNaN(d) ? s : d.toLocaleDateString('el-GR', { day: '2-digit', month: '2-digit', year: 'numeric' });
};
const todayLocal = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const kaekOk = (k) => !k || /^\d{12}(\/\d+\/\d+)?$/.test(String(k).trim());
const fmtDT = (s) => { if (!s) return ''; const d = new Date(s); return isNaN(d) ? s : d.toLocaleString('el-GR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };

function toast(msg, kind = '') {
  const t = $('toast'); t.textContent = msg; t.className = kind; clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add('hidden'), kind === 'err' ? 5000 : 2500);
}

async function api(path, opts = {}) {
  let r;
  try {
    r = await fetch('/api/' + path, {
      method: opts.method || 'GET',
      headers: { 'content-type': 'application/json', ...(TOKEN ? { authorization: 'Bearer ' + TOKEN } : {}) },
      body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
    });
  } catch { throw new Error('Δεν υπάρχει σύνδεση με τον διακομιστή. Ελέγξτε το διαδίκτυο και δοκιμάστε ξανά.'); }
  let d = {}; try { d = await r.json(); } catch {}
  if (r.status === 401 && path !== 'login' && path !== 'password') { logout(true); throw new Error(d.error || 'Απαιτείται σύνδεση'); }
  if (!r.ok) { const e = new Error(d.error || ('Σφάλμα HTTP ' + r.status)); e.status = r.status; e.data = d; throw e; }
  return d;
}

// ===================== ΣΥΝΔΕΣΗ =====================
async function doLogin(e) {
  e.preventDefault(); $('lgErr').textContent = ''; $('lgBtn').disabled = true;
  try {
    const d = await api('login', { method: 'POST', body: { username: $('lgUser').value, password: $('lgPass').value } });
    TOKEN = d.token; localStorage.setItem('pm_token', TOKEN); ME = d.user; $('lgPass').value = '';
    await startApp();
  } catch (err) { $('lgErr').textContent = err.message; }
  finally { $('lgBtn').disabled = false; }
}
function logout(expired) {
  TOKEN = ''; ME = null; CUR = null; CUR_REVIEWS = []; TAB = 'info'; DIRTY = false; if (VIEW !== 'plots') setView('plots', true); SEARCH = ''; FILTER = 'all'; PROJECTS = []; PROJ = null; PLOTS = []; closeModal(); localStorage.removeItem('pm_token');
  // καθαρίζουμε ό,τι έδειχνε ο προηγούμενος χρήστης (να μη μένει στη σελίδα πίσω από τη φόρμα σύνδεσης)
  $('panel').innerHTML = ''; $('compare').innerHTML = ''; $('projSel').innerHTML = '';
  PICK = false; $('map').classList.remove('picking'); OPEN_SEQ++; SAVING = false; USERS_CACHE = [];   // εκκρεμή ανοίγματα οικοπέδου αγνοούνται
  if (map) map.closePopup();
  if (markerLayer) markerLayer.clearLayers(); if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; }
  if (RULER) RULER.reset();
  if (poiLayer) poiLayer.clearLayers();
  $('login').classList.remove('hidden');
  if (expired === true) $('lgErr').textContent = 'Η σύνδεση έληξε, συνδεθείτε ξανά.';
}
async function boot() {
  initMap();
  if (!TOKEN) return;
  try { ME = await api('me'); await startApp(); }
  catch (e) { if (TOKEN) $('lgErr').textContent = 'Δεν ήταν δυνατή η επικοινωνία με τον διακομιστή. Ανανεώστε τη σελίδα ή συνδεθείτε ξανά.'; }
}
async function startApp() {
  $('whoName').textContent = ME.name || ME.username;
  $('whoRole').textContent = isAdmin() ? 'admin' : 'χρήστης';
  $('whoRole').className = 'role' + (isAdmin() ? ' admin' : '');
  $('usersBtn').classList.toggle('hidden', !isAdmin());
  $('projBtn').classList.toggle('hidden', !isAdmin());
  await loadProjects();
  await loadPlots();
  $('login').classList.add('hidden');      // μόνο αφού φορτωθούν: αλλιώς σε σφάλμα θα έμενε άδεια οθόνη
  renderList();
  setTimeout(() => map.invalidateSize(), 50);
}

// ===================== ΕΡΓΑ =====================
const projKey = () => 'pm_proj_' + (ME ? ME.username : '');
const curProj = () => PROJECTS.find(p => p.id === PROJ) || null;
async function loadProjects(keep) {
  PROJECTS = await api('projects');
  let want = keep || PROJ;
  try { want = want || localStorage.getItem(projKey()); } catch {}
  if (!PROJECTS.some(p => p.id === want)) want = (PROJECTS.find(p => !p.archived) || PROJECTS[0] || {}).id || null;
  PROJ = want;
  try { if (PROJ) localStorage.setItem(projKey(), PROJ); } catch {}
  renderProjSel(); applyProjectSettings();
}
function renderProjSel() {
  $('projSel').innerHTML = PROJECTS.length
    ? PROJECTS.map(p => `<option value="${esc(p.id)}" ${p.id === PROJ ? 'selected' : ''}>${esc(p.name)}${p.archived ? ' (αρχείο)' : ''}</option>`).join('')
    : '<option value="">— κανένα έργο —</option>';
}
// Τα κριτήρια σύμβασης και τα βάρη βαθμολογίας είναι ανά έργο: τα CFG.contract και SCORE_CRITERIA
// κρατούν τις τιμές του τρέχοντος έργου, και τα DEF_* τις προεπιλογές για όσα δεν έχει ορίσει το έργο.
const DEF_CRITERIA = { ...CFG.contract };
const DEF_WEIGHTS = {};
function applyProjectSettings() {
  const p = curProj();
  Object.assign(CFG.contract, DEF_CRITERIA, (p && p.criteria) || {});
  if (!Object.keys(DEF_WEIGHTS).length) for (const c of SCORE_CRITERIA) DEF_WEIGHTS[c[0]] = c[2];
  for (const c of SCORE_CRITERIA) c[2] = (p && p.weights && p.weights[c[0]] != null) ? p.weights[c[0]] : DEF_WEIGHTS[c[0]];
}
async function switchProject(id) {
  if (id === PROJ) return;
  if (DIRTY && !confirm('Υπάρχουν μη αποθηκευμένες αλλαγές. Να απορριφθούν;')) { renderProjSel(); return; }
  PROJ = id; DIRTY = false; CUR = null; SEARCH = '';
  try { localStorage.setItem(projKey(), PROJ); } catch {}
  applyProjectSettings();
  try { await loadPlots(); } catch (e) { toast(e.message, 'err'); }
  if (id !== PROJ) return;                 // πατήθηκε στο μεταξύ άλλο έργο
  if (VIEW === 'map') renderMapPage(false); else if (VIEW === 'compare') renderCompare(false); else renderList();
}
const fileSlug = () => { const p = curProj(); return p ? p.name.replace(/[\\/:*?"<>|]+/g, '').replace(/\s+/g, '_').slice(0, 40) + '_' : ''; };

// --- διαχείριση έργων (admin) ---
function openProjects() {
  openModal(`<div class="ph"><h2>Έργα</h2><button class="btn sm" onclick="closeModal()">✕</button></div><div class="mb" id="projBody"></div>`);
  renderProjects();
}
function renderProjects() {
  $('projBody').innerHTML = `
  <fieldset><legend>Νέο έργο</legend><div class="grid">
    <label class="fld"><span>Όνομα έργου</span><input type="text" id="npName" placeholder="π.χ. Αναζήτηση Παπαδόπουλου"></label>
    <label class="fld"><span>Πελάτης</span><input type="text" id="npClient"></label>
    <div class="full row" style="justify-content:flex-end"><button class="btn primary sm" onclick="addProject()">Δημιουργία</button></div>
  </div></fieldset>
  <div class="row" style="justify-content:space-between;margin-bottom:10px">
    <span class="note">Πλήρες αντίγραφο όλων των έργων, οικοπέδων, παρατηρήσεων και χρηστών (χωρίς κωδικούς).</span>
    <button class="btn sm" onclick="downloadBackup()">⬇ Αντίγραφο ασφαλείας</button></div>
  <div class="plist">${PROJECTS.map(p => `<div class="pitem">
    <div class="nm"><b>${esc(p.name)}</b>${p.archived ? ' <span class="bdg">αρχείο</span>' : ''}${p.id === PROJ ? ' <span class="bdg b">τρέχον</span>' : ''}
      <div class="note">${esc(p.client || '')}</div></div>
    <button class="btn sm" onclick="editProject('${esc(p.id)}')">Ρυθμίσεις</button></div>`).join('') || '<div class="note">Κανένα έργο</div>'}</div>`;
}
async function downloadBackup() {
  try {
    const data = await api('backup');
    const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'plotmanager_backup_' + todayLocal() + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast(`Αντίγραφο: ${data.projects.length} έργα, ${data.plots.length} οικόπεδα, ${data.reviews.length} παρατηρήσεις`, 'ok');
  } catch (e) { toast(e.message, 'err'); }
}
async function addProject() {
  try {
    const p = await api('projects', { method: 'POST', body: { name: $('npName').value, client: $('npClient').value } });
    await loadProjects(PROJ); toast('Το έργο δημιουργήθηκε', 'ok'); editProject(p.id);
  } catch (e) { toast(e.message, 'err'); }
}
function editProject(id) {
  const p = PROJECTS.find(x => x.id === id); if (!p) return;
  const c = { ...DEF_CRITERIA, ...(p.criteria || {}) }, w = { ...DEF_WEIGHTS, ...(p.weights || {}) };
  const n = (k, v, lbl) => `<label class="fld"><span>${lbl}</span><input type="text" inputmode="decimal" data-pk="${k}" value="${esc(String(v).replace('.', ','))}"></label>`;
  $('projBody').innerHTML = `
  <div class="row" style="margin-bottom:10px"><button class="btn sm" onclick="renderProjects()">← Έργα</button></div>
  <fieldset><legend>Στοιχεία έργου</legend><div class="grid">
    <label class="fld"><span>Όνομα έργου</span><input type="text" id="epName" value="${esc(p.name)}"></label>
    <label class="fld"><span>Πελάτης</span><input type="text" id="epClient" value="${esc(p.client || '')}"></label>
    <label class="fld full"><span>Περιγραφή / σύμβαση</span><textarea id="epDesc" rows="2">${esc(p.description || '')}</textarea></label>
    <label class="chk"><input type="checkbox" id="epArch" ${p.archived ? 'checked' : ''}><span>Αρχειοθετημένο (ολοκληρώθηκε)</span></label>
  </div></fieldset>
  <fieldset><legend>Κριτήρια σύμβασης</legend><div class="grid">
    ${n('c.center_km', c.center_km, 'Απόσταση από κέντρο &lt; (km)')}${n('c.sea_km', c.sea_km, 'Απόσταση από θάλασσα &lt; (km)')}
    ${n('c.road_m', c.road_m, 'Πλάτος οδού &gt; (m)')}${n('c.net_ratio', c.net_ratio, 'Λόγος καθαρού / μικτού')}
    ${n('c.house_min_m2', c.house_min_m2, 'Κατοικία: ελάχ. καθαρό (m²)')}${n('c.house_max_m2', c.house_max_m2, 'Κατοικία: μέγ. καθαρό (m²)')}
  </div></fieldset>
  <fieldset><legend>Βάρη βαθμολογίας (%)</legend><div class="grid">
    ${SCORE_CRITERIA.map(([k, l]) => n('w.' + k, w[k], l)).join('')}
  </div></fieldset>
  <div class="row" style="justify-content:space-between">
    <button class="btn danger sm" onclick="deleteProject('${esc(p.id)}')">Διαγραφή έργου</button>
    <button class="btn success" onclick="saveProject('${esc(p.id)}')">Αποθήκευση</button>
  </div>`;
}
async function saveProject(id) {
  const body = { name: $('epName').value, client: $('epClient').value, description: $('epDesc').value, archived: $('epArch').checked, criteria: {}, weights: {} };
  for (const el of document.querySelectorAll('#projBody [data-pk]')) {
    const v = parseNum(el.value, true), [g, k] = el.dataset.pk.split('.');
    const bad = v === null || Number.isNaN(v) || v < 0 || (k === 'net_ratio' && (v < 0.3 || v > 1)) || (g === 'w' && v > 100);
    el.classList.toggle('invalid', bad);
    if (bad) return toast(k === 'net_ratio' ? 'Ο λόγος καθαρού/μικτού πρέπει να είναι από 0,3 έως 1' : g === 'w' ? 'Τα βάρη πρέπει να είναι από 0 έως 100' : 'Μη έγκυρη τιμή στα κριτήρια', 'err');
    (g === 'c' ? body.criteria : body.weights)[k] = v;
  }
  try {
    await api('projects/' + id, { method: 'PUT', body });
    await loadProjects(PROJ); toast('Το έργο αποθηκεύτηκε', 'ok'); renderProjects();
    if (id === PROJ) { if (VIEW === 'compare') renderCompare(false); else if (CUR) renderDetail(); else if (VIEW === 'plots') renderList(); }
  } catch (e) { toast(e.message, 'err'); }
}
async function deleteProject(id) {
  const p = PROJECTS.find(x => x.id === id);
  if (!confirm(`Διαγραφή του έργου «${p ? p.name : ''}»; (Επιτρέπεται μόνο αν δεν έχει οικόπεδα.)`)) return;
  try {
    await api('projects/' + id, { method: 'DELETE' });
    await loadProjects(id === PROJ ? null : PROJ); toast('Το έργο διαγράφηκε', 'ok'); renderProjects();
    if (id !== PROJ) return;
    await loadPlots(); if (VIEW === 'map') renderMapPage(false); else if (VIEW === 'compare') renderCompare(false); else renderList();
  } catch (e) { toast(e.message, 'err'); }
}

// ===================== ΧΑΡΑΚΑΣ (μέτρηση απόστασης) =====================
// Αυτόνομη συνάρτηση: χρησιμοποιείται στον κύριο χάρτη και ενσωματώνεται αυτούσια στον χάρτη της Αναφοράς.
// Γεωδαιτική απόσταση Vincenty (WGS84). Κλικ: σημείο · διπλό κλικ / «Τέλος»: ολοκλήρωση · Esc: καθαρισμός.
function addRuler(map, doc, opts) {
  opts = opts || {};
  if (!doc.getElementById('ruler-css')) {
    const st = doc.createElement('style'); st.id = 'ruler-css';
    st.textContent = `
.ruler-tools a{font-size:16px;line-height:30px;text-align:center;cursor:pointer;user-select:none}
.ruler-tools a.on{background:#ffdf5d!important;color:#0d1117!important}
.ruler-measuring,.ruler-measuring .leaflet-interactive{cursor:crosshair!important}
/* !important: ο Leaflet έχει πιο ειδικό κανόνα (.leaflet-pane > svg path.leaflet-interactive) που κάνει τα σημεία πατήσιμα */
.ruler-measuring .leaflet-interactive,.ruler-measuring .leaflet-marker-icon{pointer-events:none!important}
.ruler-lbl{background:rgba(13,17,23,.9);color:#ffdf5d;border:1px solid #ffdf5d;border-radius:3px;padding:0 5px;
  font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;box-shadow:none;white-space:nowrap}
.ruler-lbl:before{display:none}
.ruler-box{position:absolute;left:10px;bottom:34px;z-index:800;background:#161b22;color:#e6edf3;border:1px solid #ffdf5d;
  border-radius:6px;padding:8px 10px;font:12px/1.45 -apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;display:none;max-width:calc(100% - 20px)}
.ruler-box.show{display:block}
.ruler-box b{color:#ffdf5d;font-size:15px;font-variant-numeric:tabular-nums}
.ruler-box .r-hint{color:#8b949e;margin-top:3px}
.ruler-box button{margin:6px 4px 0 0;background:transparent;border:1px solid #30363d;color:#e6edf3;border-radius:6px;padding:3px 9px;font:inherit;cursor:pointer}
.ruler-box button:hover{border-color:#ffdf5d}
.ruler-box button:disabled{opacity:.45;cursor:default}
@media print{.ruler-tools,.ruler-box button,.ruler-box .r-help{display:none!important}}`;
    doc.head.appendChild(st);
  }
  const geoDist = (a, b) => {
    const A = 6378137, F = 1 / 298.257223563, B = A * (1 - F), r = Math.PI / 180;
    const L_ = (b.lng - a.lng) * r, U1 = Math.atan((1 - F) * Math.tan(a.lat * r)), U2 = Math.atan((1 - F) * Math.tan(b.lat * r));
    const sU1 = Math.sin(U1), cU1 = Math.cos(U1), sU2 = Math.sin(U2), cU2 = Math.cos(U2);
    let lam = L_, it = 0, sS, cS, sig, sA, c2A, c2Sm, lamP;
    do {
      const sL = Math.sin(lam), cL = Math.cos(lam);
      sS = Math.sqrt((cU2 * sL) ** 2 + (cU1 * sU2 - sU1 * cU2 * cL) ** 2);
      if (sS === 0) return 0;
      cS = sU1 * sU2 + cU1 * cU2 * cL; sig = Math.atan2(sS, cS);
      sA = cU1 * cU2 * sL / sS; c2A = 1 - sA * sA;
      c2Sm = c2A ? cS - 2 * sU1 * sU2 / c2A : 0;
      const C = F / 16 * c2A * (4 + F * (4 - 3 * c2A));
      lamP = lam; lam = L_ + (1 - C) * F * sA * (sig + C * sS * (c2Sm + C * cS * (-1 + 2 * c2Sm * c2Sm)));
    } while (Math.abs(lam - lamP) > 1e-12 && ++it < 200);
    if (it >= 200) return map.distance(a, b);
    const u2 = c2A * (A * A - B * B) / (B * B);
    const kA = 1 + u2 / 16384 * (4096 + u2 * (-768 + u2 * (320 - 175 * u2))), kB = u2 / 1024 * (256 + u2 * (-128 + u2 * (74 - 47 * u2)));
    const dS = kB * sS * (c2Sm + kB / 4 * (cS * (-1 + 2 * c2Sm * c2Sm) - kB / 6 * c2Sm * (-3 + 4 * sS * sS) * (-3 + 4 * c2Sm * c2Sm)));
    return B * kA * (sig - dS);
  };
  const fmtM = (d) => {
    const m = Math.round(d).toLocaleString('el-GR') + ' m';
    return d >= 1000 ? `${m} (${(d / 1000).toLocaleString('el-GR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} km)` : m;
  };
  const layer = L.layerGroup().addTo(map);
  let on = false, pts = [], ghost = null, ghostLbl = null;
  const Ctl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd() {
      const c = L.DomUtil.create('div', 'leaflet-bar ruler-tools');
      c.innerHTML = '<a href="#" role="button" title="Μέτρηση απόστασης" aria-label="Μέτρηση απόστασης">📏</a>';
      L.DomEvent.disableClickPropagation(c);
      return c;
    },
  });
  const btn = new Ctl().addTo(map).getContainer().querySelector('a');
  const box = L.DomUtil.create('div', 'ruler-box', map.getContainer());
  box.setAttribute('role', 'status'); box.setAttribute('aria-live', 'polite');
  box.innerHTML = '<div>Απόσταση: <b class="r-total">0 m</b></div><div class="r-hint r-segs"></div>' +
    '<div class="r-hint r-help">Κλικ στον χάρτη για σημεία. Διπλό κλικ ή «Τέλος» για ολοκλήρωση.</div>' +
    '<button type="button" class="r-undo">Αναίρεση</button><button type="button" class="r-clear">Καθαρισμός</button><button type="button" class="r-done">Τέλος</button>';
  L.DomEvent.disableClickPropagation(box); L.DomEvent.disableScrollPropagation(box);
  const q = (sel) => box.querySelector(sel);
  const total = () => { let d = 0; for (let i = 1; i < pts.length; i++) d += geoDist(pts[i - 1], pts[i]); return d; };
  const busy = () => doc.body.classList.toggle('ruler-on', on || pts.length > 0);
  function draw() {
    layer.clearLayers(); ghost = null; ghostLbl = null;
    if (pts.length > 1) {
      L.polyline(pts, { color: '#0d1117', weight: 5, opacity: .45, interactive: false }).addTo(layer);
      L.polyline(pts, { color: '#ffdf5d', weight: 3, dashArray: '6 5', interactive: false }).addTo(layer);
    }
    let cum = 0;
    pts.forEach((p, i) => {
      if (i) cum += geoDist(pts[i - 1], p);
      const v = L.circleMarker(p, { radius: 5, weight: 2, color: '#0d1117', fillColor: '#ffdf5d', fillOpacity: 1, interactive: false }).addTo(layer);
      if (i) v.bindTooltip(fmtM(cum), { permanent: true, direction: 'right', offset: [7, 0], className: 'ruler-lbl' });
    });
    const segs = []; for (let i = 1; i < pts.length; i++) segs.push(Math.round(geoDist(pts[i - 1], pts[i])).toLocaleString('el-GR'));
    q('.r-total').textContent = fmtM(total());
    q('.r-segs').textContent = segs.length > 1 ? 'Τμήματα: ' + segs.join(' + ') + ' m' : '';
    q('.r-help').style.display = on ? '' : 'none';
    q('.r-done').style.display = on ? '' : 'none';
    q('.r-undo').disabled = !pts.length;
    busy();
  }
  function setOn(v) {
    on = v;
    btn.classList.toggle('on', v);
    map.getContainer().classList.toggle('ruler-measuring', v);
    if (v) { map.closePopup(); map.doubleClickZoom.disable(); box.classList.add('show'); if (opts.onStart) opts.onStart(); }
    else { map.doubleClickZoom.enable(); if (!pts.length) box.classList.remove('show'); }
    draw();
  }
  function clear() { pts = []; draw(); if (!on) box.classList.remove('show'); }
  btn.addEventListener('click', (e) => { e.preventDefault(); if (on) { setOn(false); clear(); } else { clear(); setOn(true); } });
  map.on('click', (e) => {
    if (!on) return;
    const lp = pts[pts.length - 1];
    if (lp && map.latLngToContainerPoint(lp).distanceTo(e.containerPoint) < 3) return;   // 2ο κλικ διπλού κλικ
    pts.push(e.latlng); draw();
  });
  map.on('dblclick', () => {
    if (!on) return;
    while (pts.length > 1 && pts[pts.length - 1].distanceTo(pts[pts.length - 2]) < 0.5) pts.pop();
    setOn(false);
  });
  map.on('popupopen', () => { if (on) map.closePopup(); });
  map.on('mousemove', (e) => {
    if (!on || !pts.length) return;
    const last = pts[pts.length - 1], d = total() + geoDist(last, e.latlng);
    if (!ghost) {
      ghost = L.polyline([last, e.latlng], { color: '#ffdf5d', weight: 2, opacity: .7, dashArray: '2 6', interactive: false }).addTo(layer);
      ghostLbl = L.tooltip({ permanent: true, direction: 'right', offset: [10, 0], className: 'ruler-lbl' }).setLatLng(e.latlng).setContent(fmtM(d)).addTo(layer);
    } else { ghost.setLatLngs([last, e.latlng]); ghostLbl.setLatLng(e.latlng).setContent(fmtM(d)); }
  });
  q('.r-undo').onclick = () => { pts.pop(); draw(); };
  q('.r-clear').onclick = () => clear();
  q('.r-done').onclick = () => setOn(false);
  doc.addEventListener('keydown', (e) => { if (e.key === 'Escape' && (on || pts.length)) { setOn(false); clear(); } });
  draw();
  return { active: () => on, reset: () => { setOn(false); clear(); }, distance: geoDist };
}

// ===================== ΣΗΜΕΙΑ ΜΕ ΕΤΙΚΕΤΑ (ανά οικόπεδο) =====================
const POI_COLORS = [['#f0883e', 'Πορτοκαλί'], ['#f85149', 'Κόκκινο'], ['#a371f7', 'Μωβ'], ['#3fb950', 'Πράσινο'], ['#58a6ff', 'Μπλε'], ['#e3b341', 'Κίτρινο']];
const poiSvg = (c) => `<svg width="24" height="32" viewBox="0 0 24 32" aria-hidden="true"><path d="M12 1C6 1 1.5 5.5 1.5 11.3 1.5 19 12 31 12 31s10.5-12 10.5-19.7C22.5 5.5 18 1 12 1z" fill="${c}" stroke="#0d1117" stroke-width="1.5"/><circle cx="12" cy="11" r="4" fill="#fff"/></svg>`;
const plotPois = (p) => (Array.isArray(p.markers) ? p.markers : []).filter(mk => Number.isFinite(mk.lat) && Number.isFinite(mk.lng));
const poiIcon = (c) => L.divIcon({ className: 'poi-ico', html: poiSvg(c), iconSize: [24, 32], iconAnchor: [12, 31], tooltipAnchor: [0, -29] });
const fmtDist = (d) => d >= 1000 ? (d / 1000).toLocaleString('el-GR', { maximumFractionDigits: 2 }) + ' km' : Math.round(d).toLocaleString('el-GR') + ' m';
function poiDist(mk, p = CUR) {                     // απόσταση σημείου από το οικόπεδο (Vincenty, ίδια με τον χάρακα)
  const lat = num(p && p.lat), lng = num(p && p.lng);
  return lat === null || lng === null || !RULER ? '' : fmtDist(RULER.distance(L.latLng(lat, lng), L.latLng(mk.lat, mk.lng)));
}
// Τα σημεία φαίνονται όταν είναι ανοιχτός ο φάκελος ενός οικοπέδου
function drawPoi() {
  if (!poiLayer) return;
  poiLayer.clearLayers();
  if (!CUR || VIEW !== 'plots' || !Array.isArray(CUR.markers)) return;
  CUR.markers.forEach((mk, i) => {
    const mm = L.marker([mk.lat, mk.lng], { icon: poiIcon(mk.color), draggable: isAdmin(), keyboard: false, zIndexOffset: 500, title: mk.label || '' })
      .bindTooltip(esc(mk.label || '—'), { permanent: true, direction: 'top', className: 'poi-lbl' })
      .addTo(poiLayer);
    mm.on('dragend', () => {
      const ll = mm.getLatLng();
      CUR.markers[i].lat = +ll.lat.toFixed(7); CUR.markers[i].lng = +ll.lng.toFixed(7);
      markDirty(); if (TAB === 'info') renderTab();
    });
  });
}
function startPoiPick() {
  if (RULER && RULER.active()) RULER.reset();
  PICK = 'poi'; $('map').classList.add('picking');
  if (window.innerWidth <= 820) $('panel').classList.add('collapsed');
  toast('Πατήστε στον χάρτη για να τοποθετήσετε το νέο σημείο (Esc: ακύρωση)');
}
function addPoiAt(latlng) {

  CUR.markers.push({ id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), lat: +latlng.lat.toFixed(7), lng: +latlng.lng.toFixed(7), label: 'Σημείο ' + (CUR.markers.length + 1), color: POI_COLORS[0][0] });

function delPoi(i) { CUR.markers.splice(i, 1); markDirty(); renderTab(); drawPoi(); }
function focusPoi(i) {
  const mk = CUR.markers[i]; if (!mk) return;
  map.setView([mk.lat, mk.lng], Math.max(map.getZoom(), 18));

function poiListHtml() {

// ===================== ΧΑΡΤΗΣ =====================
function initMap() {
  map = L.map('map', { zoomControl: true, maxZoom: 20 }).setView(CFG.center, CFG.zoom);
  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' });
  const ktima = L.tileLayer.wms(CFG.ktimaWms, { layers: CFG.ktimaLayer, format: 'image/png', transparent: true, version: '1.1.1', crs: L.CRS.EPSG4326, maxZoom: 20, minZoom: 6, bounds: [[34.5, 19.0], [41.5, 28.5]], attribution: 'Κτηματολόγιο ©' });
  osm.addTo(map);
  L.control.layers({ 'OpenStreetMap': osm, 'Κτηματολόγιο (ορθοφωτό)': ktima }, {}, { position: 'topright' }).addTo(map);
  L.control.scale({ imperial: false }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
  poiLayer = L.layerGroup().addTo(map);
  map.on('click', onMapClick);
  // ο χάρακας ακυρώνει την «επιλογή θέσης από τον χάρτη», ώστε ένα κλικ να μη κάνει δύο πράγματα
  RULER = addRuler(map, document, { onStart: () => { if (PICK) { PICK = false; $('map').classList.remove('picking'); } } });
}
// Κατάσταση κριτηρίων σύμβασης: το τσεκ «πρώτος έλεγχος» σημαίνει ότι ο έλεγχος ΕΓΙΝΕ·
// αν οι καταχωρημένες τιμές αποτυγχάνουν, δεν εμφανίζεται ως ✓ (χωρίς τιμές ισχύει η κρίση του διαχειριστή)
function critStatus(p) {
  if (p.crit_rejected) return 'rejected';
  if (!p.crit_checked) return null;
  return critEval(p).all === false ? 'fail' : 'ok';
}
const CRIT_BADGE = {
  rejected: '<span class="bdg r">Απορρίφθηκε (κριτήρια)</span>',
  fail: '<span class="bdg o" title="Ο έλεγχος έγινε, αλλά κάποια τιμή είναι εκτός των ορίων της σύμβασης">Κριτήρια ✗ εκτός ορίων</span>',
  ok: '<span class="bdg g">Κριτήρια ✓</span>',
};
function plotColor(p) {
  if (p.crit_rejected || phaseOf(p) === 'rejected') return '#f85149';
  if (['B', 'done'].includes(phaseOf(p))) return '#a371f7';
  if (p.rejections && p.rejections.length) return '#d29922';
  if (p.approvals && p.approvals.length) return '#a371f7';
  if (critStatus(p) === 'fail') return '#f0883e';
  if (critStatus(p) === 'ok') return '#3fb950';
  return '#58a6ff';
}
function renderMarkers() {
  markerLayer.clearLayers();
  const pts = [];
  // σελίδα χάρτη: φίλτρο χάρτη · λίστα: ό,τι φαίνεται στη λίστα · ανοιχτός φάκελος: όλα (για μετάβαση)
  for (const p of (VIEW === 'map' ? mapPlots() : (CUR ? PLOTS : filteredPlots()))) {
    const lat = num(p.lat), lng = num(p.lng);
    if (lat === null || lng === null) continue;
    const sel = CUR && CUR.id === p.id;
    const m = L.circleMarker([lat, lng], { radius: sel ? 10 : 7, color: sel ? '#fff' : '#0d1117', weight: 2, fillColor: plotColor(p), fillOpacity: .95 });
    m.bindTooltip(esc((p.code ? p.code + ' · ' : '') + (p.title || '')), { direction: 'top', offset: [0, -6] });
    if (VIEW === 'map') m.bindPopup(plotPopup(p), { maxWidth: 280 });
    else m.on('click', (e) => {
      if (RULER && RULER.active()) return;
      L.DomEvent.stopPropagation(e);
      if (PICK) onMapClick(e);                       // επιλογή θέσης: το κλικ μετρά ως κλικ στον χάρτη
      else openPlot(p.id);
    });
    m.addTo(markerLayer); pts.push([lat, lng]);
  }

}
function fitAll() {
  const pts = renderMarkers();
  if (pts.length === 1) map.setView(pts[0], 16);
  else if (pts.length > 1) map.fitBounds(pts, { padding: [40, 40], maxZoom: 16 });
}
function startPick() {
  if (RULER && RULER.active()) RULER.reset();
  PICK = 'plot'; $('map').classList.add('picking');
  if (window.innerWidth <= 820) $('panel').classList.add('collapsed');
  toast('Πατήστε στον χάρτη για να ορίσετε τη θέση του οικοπέδου (Esc: ακύρωση)');
}
function onMapClick(e) {
  if (RULER && RULER.active()) return;

  if (PICK === 'poi') { PICK = false; $('map').classList.remove('picking'); return addPoiAt(e.latlng); }

  CUR.lat = +e.latlng.lat.toFixed(7); CUR.lng = +e.latlng.lng.toFixed(7);

// Esc: κλείνει μεγέθυνση φωτογραφίας ή παράθυρο· αλλιώς ακυρώνει την «επιλογή από τον χάρτη»

// ===================== ΣΕΛΙΔΑ ΧΑΡΤΗ =====================
function setView(v, force) {
  if (v === VIEW) return;
  if (!force && DIRTY && !confirm('Υπάρχουν μη αποθηκευμένες αλλαγές. Να απορριφθούν;')) return;
  VIEW = v; DIRTY = false; PICK = false; $('map').classList.remove('picking');
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('panel').classList.toggle('hidden', v !== 'plots');
  $('mapTools').classList.toggle('hidden', v !== 'map');
  $('map').classList.toggle('hidden', v === 'compare');
  $('compare').classList.toggle('hidden', v !== 'compare');
  map.closePopup();
  if (force) return;
  if (v !== 'plots') { CUR = null; if (tempMarker) { map.removeLayer(tempMarker); tempMarker = null; } drawPoi(); }
  if (v === 'map') renderMapPage(true);
  else if (v === 'compare') renderCompare(true);
  else renderList();
  setTimeout(() => map.invalidateSize(), 50);
}
// Απορριφθέν: ρητή απόρριψη (φάση/κριτήρια) ή ΑΠΟΡΡΙΨΗ πελάτη πριν ξεκινήσει το Τμήμα Β
const isRejected = (p) => {
  if (phaseOf(p) === 'rejected' || p.crit_rejected) return true;
  if (['B', 'done'].includes(phaseOf(p))) return false;
  return !!(p.rejections && p.rejections.length);
};
const hasPos = (p) => num(p.lat) !== null && num(p.lng) !== null;
function mapPlots() {
  const withRej = $('mtRej') ? $('mtRej').checked : true;
  return PLOTS.filter(p => hasPos(p) && (withRej || !isRejected(p)));
}
async function renderMapPage(reload) {
  if (reload) { try { await loadPlots(); } catch (e) { toast(e.message, 'err'); } }
  const shown = mapPlots(), noPos = PLOTS.filter(p => !hasPos(p)).length;
  $('mtCount').textContent = `${shown.length} στον χάρτη` + (noPos ? ` · ${noPos} χωρίς θέση` : '');
  fitAll();
}
function plotPopup(p) {

    ${num(p.area) !== null ? fmt(num(p.area)) + ' m²' : ''}${num(p.price) !== null ? ' · ' + fmt(num(p.price), 0) + ' €' : ''}
    <div class="badges" style="margin:4px 0 8px">${st}${p.rejections && p.rejections.length ? `<span class="bdg o">ΑΠΟΡΡΙΨΗ ×${p.rejections.length}</span>` : ''}${p.units ? `<span class="bdg b">${esc(unitsLabel(p.units))}</span>` : ''}</div>
    <div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn primary sm" onclick="openFromMap('${p.id}')">📁 Άνοιγμα φακέλου</button>
    <button class="btn sm" onclick="copyCoords('${p.id}')" title="Αντιγραφή συντεταγμένων για πρόγραμμα πλοήγησης">📋 Συντεταγμένες</button>

    <a class="btn sm" target="_blank" rel="noopener" href="${esc(teeUrl(p))}" title="Ενιαίος Ψηφιακός Χάρτης ΤΕΕ">Χάρτης ΤΕΕ ↗</a>
    <button class="btn sm" onclick="openValuemaps('${p.id}')" title="valuemaps.gov.gr (αντιγράφει τις συντεταγμένες)">Αντικ. αξίες ↗</button>
    <a class="btn sm" target="_blank" rel="noopener" href="${esc(floodsUrl(p))}" title="Χάρτες κινδύνου πλημμύρας ΥΠΕΝ">Πλημμύρες ↗</a></div>`;
}
// Αντιγραφή «πλάτος, μήκος» (WGS84, δεκαδικές μοίρες με τελεία): η μορφή που δέχονται
// Google Maps, Waze, Apple Maps και τα περισσότερα GPS στην αναζήτηση
// Συγχρονισμένη αντιγραφή: ολοκληρώνεται αμέσως, όσο η σελίδα έχει ακόμη το focus
// (απαραίτητο όταν αμέσως μετά ανοίγει νέα καρτέλα). readOnly: χωρίς πληκτρολόγιο στο κινητό.
function copySync(txt) {
  const ta = document.createElement('textarea'); ta.value = txt; ta.readOnly = true;
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, txt.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch {}
  ta.remove(); return ok;
}
// Πρώτα συγχρονισμένα· αν ο browser δεν το επιτρέπει, με το Clipboard API
async function copyText(txt) {
  if (copySync(txt)) return true;
  try { await navigator.clipboard.writeText(txt); return true; } catch { return false; }
}
const plotById = (id) => (CUR && (!id || CUR.id === id)) ? CUR : PLOTS.find(x => x.id === id);
const coordText = (p) => { const lat = num(p && p.lat), lng = num(p && p.lng); return lat === null || lng === null ? null : `${lat.toFixed(6)}, ${lng.toFixed(6)}`; };
async function copyCoords(id) {
  const txt = coordText(plotById(id));
  if (!txt) return toast('Δεν έχει οριστεί θέση', 'err');

  toast(ok ? `Αντιγράφηκαν: ${txt} — επικολλήστε τις στην αναζήτηση του προγράμματος πλοήγησης` : `Συντεταγμένες: ${txt}`, ok ? 'ok' : '');
}

const teeUrl = (p) => { const lat = num(p.lat), lng = num(p.lng); return lat === null || lng === null ? null : `https://sdigmap.tee.gov.gr/sdmquery/public/?center=${lng.toFixed(7)},${lat.toFixed(7)}&level=18`; };
// Χάρτες κινδύνου πλημμύρας (ΥΠΕΝ): ο σύνδεσμος δέχεται κέντρο και zoom

// Εξαγωγή CSV στη μορφή εισαγωγής του mySimpleGIS (Πινέζες σε ΕΓΣΑ'87)
if (window.proj4) proj4.defs('EPSG:2100', '+proj=tmerc +lat_0=0 +lon_0=24 +k=0.9996 +x_0=500000 +y_0=0 +ellps=GRS80 +towgs84=-199.87,74.79,246.62,0,0,0,0 +units=m +no_defs');
function exportMySimpleGIS() {
  if (!window.proj4) return toast('Δεν φορτώθηκε η βιβλιοθήκη μετατροπής συντεταγμένων. Ανανεώστε τη σελίδα.', 'err');
  const list = mapPlots();
  if (!list.length) return toast('Δεν υπάρχουν οικόπεδα με θέση για εξαγωγή', 'err');
  const q = (v) => '"' + String(v ?? '').replace(/[\r\n]+/g, ' | ').replace(/"/g, "'") + '"';
  const lines = [
    '"=== ΕΞΑΓΩΓΗ ΣΧΗΜΑΤΩΝ ==="',
    '"Για πινέζες και circlemarkers: Σχήμα,Τίτλος,Σχόλια,Χρώμα,Χ,Υ"',
    '',
    "Σχήμα,Τίτλος,Σχόλια,Χρώμα,Πληροφορία,Συντεταγμένες Χ,Υ (ΕΓΣΑ'87)",
  ];
  let nPoi = 0;
  for (const p of list) {
    const [x, y] = proj4('EPSG:4326', 'EPSG:2100', [num(p.lng), num(p.lat)]);
    const name = (p.code ? p.code + ' ' : '') + (p.title || '');
    const comment = [
      p.municipality, p.address,
      num(p.area) !== null ? fmt(num(p.area)) + ' m²' : '',
      num(p.price) !== null ? fmt(num(p.price), 0) + ' €' : '',
      p.kaek ? 'ΚΑΕΚ ' + p.kaek : '',
      p.ot ? 'Ο.Τ. ' + p.ot : '',
      p.pol_enotita ? 'Π.Ε. ' + p.pol_enotita : '',
      ({ rejected: 'Απορρίφθηκε (κριτήρια)', fail: 'Κριτήρια εκτός ορίων', ok: 'Κριτήρια OK' })[critStatus(p)] || '',
      p.rejections && p.rejections.length ? 'ΑΠΟΡΡΙΨΗ: ' + p.rejections.join('/') : '',
      p.units ? unitsLabel(p.units) : '',
      p.contact_name ? (p.contact_type === 'broker' ? 'Μεσίτης: ' : 'Ιδιοκτήτης: ') + p.contact_name + (p.contact_phone ? ' ' + p.contact_phone : '') : '',
    ].filter(Boolean).join(' · ');
    lines.push(['Πινέζα', q(name), q(comment), q(plotColor(p)), q('-'), q(x.toFixed(2) + ',' + y.toFixed(2))].join(','));
    for (const mk of plotPois(p)) {
      const [mx, my] = proj4('EPSG:4326', 'EPSG:2100', [mk.lng, mk.lat]);
      const d = poiDist(mk, p);
      lines.push(['Πινέζα', q(mk.label || 'Σημείο'), q(`Σημείο οικοπέδου ${p.code || p.title || ''}${d ? ' · ' + d + ' από το οικόπεδο' : ''}`), q(mk.color), q('-'), q(mx.toFixed(2) + ',' + my.toFixed(2))].join(','));
      nPoi++;
    }
  }
  const blob = new Blob(['\ufeff' + lines.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'plotmanager_' + fileSlug() + todayLocal() + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(`Εξήχθησαν ${list.length} οικόπεδα${nPoi ? ` και ${nPoi} σημεία` : ''}`, 'ok');
}

// Άνοιγμα maps.ktimatologio.gr κεντραρισμένου στο οικόπεδο.
// Ο χάρτης (ArcGIS Experience Builder) δέχεται στο #hash: center:X,Y,102100 (Web Mercator) και level (zoom).
// Η επιλογή του γεωτεμαχίου γίνεται με αναζήτηση ΚΑΕΚ, γι' αυτό αντιγράφουμε και το ΚΑΕΚ.
const KTIMA_MAPS = 'https://maps.ktimatologio.gr/?locale=el';
const KTIMA_LEVEL = 19;
function ktimaUrl(p) {
  const lat = num(p.lat), lng = num(p.lng);
  if (lat === null || lng === null) return KTIMA_MAPS;
  const R = 6378137, x = R * lng * Math.PI / 180, y = R * Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
  return `${KTIMA_MAPS}#widget_6=active_datasource_id:dataSource_1,center:${x.toFixed(2)}%2C${y.toFixed(2)}%2C102100,level:${KTIMA_LEVEL}`;
}
function openKtimatologio(id) {
  const p = (CUR && (!id || CUR.id === id)) ? CUR : PLOTS.find(x => x.id === id);
  if (!p) return;
  const kaek = p.kaek && String(p.kaek).trim(), centered = num(p.lat) !== null && num(p.lng) !== null;
  // η αντιγραφή γίνεται ΠΡΙΝ ανοίξει η νέα καρτέλα, όσο η σελίδα έχει ακόμη το focus
  const copy = kaek ? copyText(kaek) : Promise.resolve(false);
  window.open(ktimaUrl(p), '_blank', 'noopener');
  const where = centered ? 'Ο χάρτης ανοίγει κεντραρισμένος στο οικόπεδο.' : 'Το οικόπεδο δεν έχει θέση· ο χάρτης ανοίγει χωρίς κεντράρισμα.';
  if (!kaek) return toast(where, centered ? 'ok' : '');
  copy.then((ok) => ok ? toast(`${where} Αντιγράφηκε το ΚΑΕΚ ${kaek}: Ctrl+V στην αναζήτηση για επιλογή του γεωτεμαχίου.`, 'ok')
                       : toast(`${where} ΚΑΕΚ για αναζήτηση: ${kaek}`));
}

// Google Earth (web): σκέτη αναζήτηση συντεταγμένων → το Earth πετά εκεί και βάζει πινέζα.
// (Με θέση κάμερας «/@…» στο τέλος, το Earth επαναφέρει μόνο την κάμερα και δεν βάζει πινέζα.)
// Η 3D όψη: shift + σύρσιμο, ή το κουμπί 3D κάτω δεξιά στο Earth.
// Η λοξή όψη με κάμερα χρησιμοποιείται στο KML (exportPlotEarthKml).
const EARTH_VIEW = { range: 800, tilt: 55, heading: 0 };
function earthUrl(p) {
  const lat = num(p.lat), lng = num(p.lng);
  if (lat === null || lng === null) return null;
  return `https://earth.google.com/web/search/${lat.toFixed(7)},${lng.toFixed(7)}`;
}

// ---- KML: κοινά βοηθήματα ----
const kx = (v) => String(v ?? '').replace(/[<>&'"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', "'": '&apos;', '"': '&quot;' }[c]));
const kmlColor = (hex) => { const h = hex.replace('#', ''); return 'ff' + h.slice(4, 6) + h.slice(2, 4) + h.slice(0, 2); };  // aabbggrr
// στυλ οικοπέδου (s…) και σημείου (m…): η ετικέτα (name) φαίνεται πάντα στο Google Earth
const kmlStyles = (plotCols, poiCols) => [...new Set(plotCols)].map((c) => `
    <Style id="s${c.slice(1)}"><IconStyle><color>${kmlColor(c)}</color><scale>1.1</scale>
      <Icon><href>https://maps.google.com/mapfiles/kml/paddle/wht-blank.png</href></Icon><hotSpot x="0.5" y="0" xunits="fraction" yunits="fraction"/></IconStyle>
      <LabelStyle><scale>0.8</scale></LabelStyle></Style>`).join('') + [...new Set(poiCols)].map((c) => `
    <Style id="m${c.slice(1)}"><IconStyle><color>${kmlColor(c)}</color><scale>0.9</scale>
      <Icon><href>https://maps.google.com/mapfiles/kml/pushpin/wht-pushpin.png</href></Icon><hotSpot x="20" y="2" xunits="pixels" yunits="pixels"/></IconStyle>
      <LabelStyle><scale>0.85</scale></LabelStyle></Style>`).join('');
function kmlPoiFolder(p) {
  const pois = plotPois(p);
  if (!pois.length) return '';
  return `
      <Folder><name>${kx('Σημεία ' + ([p.code, p.title].filter(Boolean).join(' ') || ''))}</name>${pois.map((mk) => {
        const d = poiDist(mk, p);
        return `
        <Placemark><name>${kx(mk.label || 'Σημείο')}</name>${d ? `<description>${kx(d + ' από το οικόπεδο')}</description>` : ''}<styleUrl>#m${mk.color.slice(1)}</styleUrl>
          <Point><coordinates>${mk.lng},${mk.lat},0</coordinates></Point></Placemark>`; }).join('')}
      </Folder>`;
}
function downloadKml(kml, name) {
  const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// Google Earth 3D με το οικόπεδο ΚΑΙ τα σημεία του: το Earth web δέχεται μόνο μία πινέζα στο URL,
// οπότε κατεβάζουμε KML με λοξή 3D κάμερα (LookAt) που ανοίγει στο Google Earth Pro ή εισάγεται στο Earth web.
function exportPlotEarthKml() {
  const p = CUR; if (!p) return;
  const lat = num(p.lat), lng = num(p.lng);
  if (lat === null || lng === null) return toast('Ορίστε πρώτα θέση οικοπέδου', 'err');
  const pois = plotPois(p);
  const pts = [[lat, lng], ...pois.map(mk => [mk.lat, mk.lng])];
  const la = pts.map(q => q[0]), ln = pts.map(q => q[1]);
  const cLat = (Math.min(...la) + Math.max(...la)) / 2, cLng = (Math.min(...ln) + Math.max(...ln)) / 2;
  const span = Math.max(RULER ? RULER.distance(L.latLng(Math.min(...la), Math.min(...ln)), L.latLng(Math.max(...la), Math.max(...ln))) : 0, 1);
  const range = Math.round(Math.min(Math.max(span * 2.2, EARTH_VIEW.range), 30000));
  const name = [p.code, p.title].filter(Boolean).join(' ') || 'Οικόπεδο';
  const desc = [p.municipality, p.address, num(p.area) !== null ? fmt(num(p.area)) + ' m²' : '', p.kaek ? 'ΚΑΕΚ ' + p.kaek : ''].filter(Boolean).join(' · ');
  const kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>${kx('PlotManager – ' + name)}</name>
    <LookAt><longitude>${cLng.toFixed(7)}</longitude><latitude>${cLat.toFixed(7)}</latitude><altitude>0</altitude>
      <heading>${EARTH_VIEW.heading}</heading><tilt>${EARTH_VIEW.tilt}</tilt><range>${range}</range><altitudeMode>relativeToGround</altitudeMode></LookAt>${kmlStyles([plotColor(p)], pois.map(mk => mk.color))}
    <Placemark><name>${kx(name)}</name>${desc ? `<description>${kx(desc)}</description>` : ''}
      <styleUrl>#s${plotColor(p).slice(1)}</styleUrl><Point><coordinates>${lng},${lat},0</coordinates></Point></Placemark>${kmlPoiFolder(p)}
  </Document>
</kml>
`;
  // όνομα αρχείου μόνο με λατινικούς χαρακτήρες (κάποια προγράμματα σκαλώνουν σε ελληνικά ονόματα αρχείων)
  const GR = 'αάβγδεέζηήθιίϊΐκλμνξοόπρσςτυύϋΰφχψωώ', LT = ['a','a','v','g','d','e','e','z','i','i','th','i','i','i','i','k','l','m','n','x','o','o','p','r','s','s','t','y','y','y','y','f','ch','ps','o','o'];
  const slug = String(p.code || '').toLowerCase().split('').map(c => { const i = GR.indexOf(c); return i >= 0 ? LT[i] : c; }).join('').replace(/[^a-z0-9_-]+/g, '_').replace(/^_+|_+$/g, '');
  downloadKml(kml, 'plotmanager_3d_' + (slug || String(p.id).slice(0, 8)) + '.kml');
  toast(`Κατέβηκε KML με το οικόπεδο${pois.length ? ` και ${pois.length} σημεία` : ''}${DIRTY ? ' (περιλαμβάνει μη αποθηκευμένες αλλαγές)' : ''}. Άνοιγμα: Google Earth Pro → File → Open, ή earth.google.com → Έργα → Νέο → Εισαγωγή αρχείου KML`, DIRTY ? '' : 'ok');
}

// Εξαγωγή KML (Google Earth, QGIS, mySimpleGIS): ένα Placemark ανά οικόπεδο, φάκελοι ανά φάση, και τα σημεία του
function exportKML() {
  const list = mapPlots();
  if (!list.length) return toast('Δεν υπάρχουν οικόπεδα με θέση για εξαγωγή', 'err');
  const x = kx;
  const cdata = (v) => '<![CDATA[' + String(v).replace(/]]>/g, ']]]]><![CDATA[>') + ']]>';
  const proj = curProj();
  const styles = kmlStyles(list.map(plotColor), list.flatMap(p => plotPois(p).map(mk => mk.color)));
  const placemark = (p) => {
    const e = critEval(p), sc = scoreTotal(p);
    const rows = [
      ['Φάση', phaseLabel(phaseOf(p))],
      ['Περιοχή', [p.municipality, p.address].filter(Boolean).join(' — ')],
      ['Εμβαδόν', num(p.area) !== null ? fmt(num(p.area)) + ' m²' : ''],
      ['Τιμή', num(p.price) !== null ? fmt(num(p.price), 0) + ' €' : ''],
      ['ΚΑΕΚ', p.kaek], ['Ο.Τ.', p.ot], ['Πολεοδομική Ενότητα', p.pol_enotita],
      ['Κριτήρια σύμβασης', e.all === null ? '' : (e.all ? 'ΝΑΙ' : 'ΟΧΙ') + (e.prelim ? ' (προκαταρκτικά)' : '')],
      ['Κατοικίες', p.units ? unitsLabel(p.units) : ''],
      ['Βαθμολογία', sc === null ? '' : fmt(sc, 2) + ' / 10' + (scorePartial(p) ? ` (μερική: ${scoreCount(p)}/${SCORE_CRITERIA.length})` : '')],
      ['ΕΓΚΡΙΣΗ', (p.approvals || []).join(', ')], ['ΑΠΟΡΡΙΨΗ', (p.rejections || []).join(', ')],
      ['Υπεύθυνος', p.contact_name ? (p.contact_type === 'broker' ? 'Μεσίτης: ' : 'Ιδιοκτήτης: ') + p.contact_name + (p.contact_phone ? ' ' + p.contact_phone : '') : ''],
    ].filter(([, v]) => v);
    // το «; » πριν το <br> κρατά τις γραμμές χωριστές και όταν κάποιο πρόγραμμα αφαιρεί τα HTML tags
    const desc = rows.map(([k, v]) => `<b>${x(k)}:</b> ${x(v)}; <br>`).join('');
    const data = { code: p.code, title: p.title, phase: phaseLabel(phaseOf(p)), area_m2: num(p.area), price_eur: num(p.price),
      kaek: p.kaek, ot: p.ot, pol_enotita: p.pol_enotita, municipality: p.municipality, score: sc === null ? '' : +sc.toFixed(2) };
    return `
      <Placemark><name>${x([p.code, p.title].filter(Boolean).join(' '))}</name>
        <description>${cdata(desc)}</description><styleUrl>#s${plotColor(p).slice(1)}</styleUrl>
        <ExtendedData>${Object.entries(data).filter(([, v]) => v !== null && v !== undefined && v !== '').map(([k, v]) => `<Data name="${k}"><value>${x(v)}</value></Data>`).join('')}</ExtendedData>
        <Point><coordinates>${num(p.lng)},${num(p.lat)},0</coordinates></Point></Placemark>${kmlPoiFolder(p)}`;
  };
  const folders = PHASES.map(([ph, label]) => {
    const items = list.filter((p) => phaseOf(p) === ph);
    return items.length ? `\n    <Folder><name>${x(label)} (${items.length})</name>${items.map(placemark).join('')}\n    </Folder>` : '';
  }).join('');
  const kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
  <Document>
    <name>${x('PlotManager' + (proj ? ' – ' + proj.name : ''))}</name>
    <description>${x((proj && proj.client ? 'Πελάτης: ' + proj.client + ' · ' : '') + 'Εξαγωγή ' + fmtDate(todayLocal()))}</description>${styles}${folders}
  </Document>
</kml>
`;
  downloadKml(kml, 'plotmanager_' + fileSlug() + todayLocal() + '.kml');
  const nPoi = list.reduce((n, p) => n + plotPois(p).length, 0);
  toast(`Εξήχθησαν ${list.length} οικόπεδα${nPoi ? ` και ${nPoi} σημεία` : ''} σε KML`, 'ok');
}

// --- Όροι δόμησης ---
const ZONES = [['', '—'], ['entos', 'Εντός σχεδίου'], ['oikismos', 'Οικισμός'], ['ektos', 'Εκτός σχεδίου'], ['other', 'Άλλο']];
const UNITS = [['', '—'], ['0', 'Καμία / δεν επαρκεί'], ['2', '2 κατοικίες'], ['3', '3 κατοικίες'], ['2-3', '2–3 κατοικίες']];
const unitsLabel = (u) => (UNITS.find(x => x[0] === String(u)) || [, ''])[1];
function tabTerms(b) {
  b.innerHTML = `
  <fieldset><legend>Όροι δόμησης</legend><div class="grid">
    ${F('Καθεστώς', 'zone', 'select', { options: ZONES })}${F('Εμβαδόν οικοπέδου (m²)', 'area', 'num')}
    ${F('Συντελεστής δόμησης (σ.δ.)', 'sd', 'num')}${F('Ποσοστό κάλυψης (%)', 'coverage', 'num')}
    ${F('Μέγιστο ύψος (m)', 'max_height', 'num')}${F('Μέγ. αριθμός ορόφων', 'max_floors', 'num')}
    ${F('Πρόσωπο οικοπέδου (m)', 'frontage', 'num')}${F('Αρτιότητα: ελάχ. εμβαδόν (m²)', 'min_area', 'num')}
    ${F('Αρτιότητα: ελάχ. πρόσωπο (m)', 'min_frontage', 'num')}${F('Δυνατότητα κατοικιών', 'units', 'select', { options: UNITS })}
    ${isAdmin() ? F('Σημειώσεις όρων / ΦΕΚ / ειδικοί όροι', 'terms_notes', 'textarea', { rows: 4 })
      : `<div class="fld full"><span>Σημειώσεις όρων</span><div class="ro">${esc(CUR.terms_notes || '—')}</div></div>`}
  </div></fieldset>
  <fieldset><legend>Υπολογισμός οικοδομικής εκμετάλλευσης</legend><div id="calcBox"></div></fieldset>`;
  renderCalc();
}
const CALC_NOTE = 'Ενδεικτικός υπολογισμός. Δεν περιλαμβάνει υπόγεια, εξώστες, ημιυπαίθριους και λοιπά πλεονάσματα/μη προσμετρούμενα.';
const FLOOR_H = 3.2;
const chk = (ok) => ok === null || ok === undefined ? '—' : (ok ? '<span class="ok">✓ ναι</span>' : '<span class="bad">✗ όχι</span>');
function calcTerms(P) {
  const E = num(P.area), sd = num(P.sd), k = num(P.coverage), H = num(P.max_height), fl = num(P.max_floors);
  const fr = num(P.frontage), minA = num(P.min_area), minF = num(P.min_frontage);
  const dom = E !== null && sd !== null ? E * sd : null;
  const cov = E !== null && k !== null ? E * k / 100 : null;
  const levels = dom && cov ? Math.ceil(dom / cov - 1e-9) : null;
  const levelsByH = H !== null ? Math.floor(H / FLOOR_H + 1e-9) : null;
  const maxLv = [levelsByH, fl].filter(x => x !== null && x >= 0);
  const lvLimit = maxLv.length ? Math.min(...maxLv) : null;
  const usable = dom !== null && cov !== null && lvLimit !== null ? Math.min(dom, cov * lvLimit) : dom;
  const artA = E !== null && minA !== null ? E >= minA : null;
  const artF = fr !== null && minF !== null ? fr >= minF : null;
  // Πόσες κατοικίες χωρούν (3, 2 ή 0): καθαρό εμβαδόν (αξιοποιήσιμη δόμηση × λόγος καθαρού/μικτού)
  // προς το ελάχιστο εμβαδόν κατοικίας της σύμβασης
  const hmin = CFG.contract.house_min_m2, net = usable === null ? null : usable * CFG.contract.net_ratio;
  const housesFit = net === null ? null : (net >= 3 * hmin ? 3 : net >= 2 * hmin ? 2 : 0);
  return { E, dom, cov, levels, lvLimit, usable, net, artA, artF, housesFit };
}
function calcTable(P) {
  const { E, dom, cov, levels, lvLimit, usable, net, artA, artF } = calcTerms(P);
  const { house_min_m2: hmin, house_max_m2: hmax } = CFG.contract;
  const per = (n) => {
    if (usable === null) return '—';
    const a = usable / n, k = net / n, ok = k >= hmin;
    return `${fmt(a, 1)} m² μικτά ≈ ${fmt(k, 0)} m² καθαρά · ${ok ? `<span class="ok">✓${k > hmax ? ' (πάνω από ' + hmax + ')' : ''}</span>` : `<span class="bad">✗ κάτω από ${hmin}</span>`}`;
  };
  return `
  <table class="calc">
    <tr><td>Εμβαδόν οικοπέδου</td><td>${fmt(E)} m²</td></tr>
    <tr><td>Μέγιστη δόμηση (Ε × σ.δ.)</td><td>${fmt(dom, 1)} m²</td></tr>
    <tr><td>Μέγιστη κάλυψη (Ε × κ)</td><td>${fmt(cov, 1)} m²</td></tr>
    <tr><td>Όροφοι για εξάντληση δόμησης</td><td>${levels ?? '—'}</td></tr>
    <tr><td>Επιτρεπτοί όροφοι (ύψος ÷ ${String(FLOOR_H).replace('.', ',')} m / μέγ. ορόφων)</td><td>${lvLimit ?? '—'}</td></tr>
    <tr><td>Αξιοποιήσιμη δόμηση</td><td>${fmt(usable, 1)} m²</td></tr>
    <tr class="h"><td colspan="2">Αρτιότητα</td></tr>
    <tr><td>Εμβαδόν ≥ ελάχιστο</td><td>${chk(artA)}</td></tr>
    <tr><td>Πρόσωπο ≥ ελάχιστο</td><td>${chk(artF)}</td></tr>
    <tr class="h"><td colspan="2">Ανά κατοικία (σύμβαση: ${CFG.contract.house_min_m2}–${CFG.contract.house_max_m2} m² καθαρά · καθαρό ≈ ${String(CFG.contract.net_ratio).replace('.', ',')} × μικτό)</td></tr>
    <tr><td>2 κατοικίες</td><td>${per(2)}</td></tr>
    <tr><td>3 κατοικίες</td><td>${per(3)}</td></tr>
  </table>`;
}
function renderCalc() {
  const box = $('calcBox'); if (!box) return;
  box.innerHTML = calcTable(CUR) + `<div class="note" style="margin-top:8px">${CALC_NOTE}</div>`;
}

  const total = price !== null && build !== null ? price + build + other : null;
  const value = usable !== null && sale !== null ? usable * sale : null;
  const margin = value !== null && total !== null ? value - total : null;
  const marginPct = margin !== null && total ? margin / total * 100 : null;
  return { usable, price, ppb, build, other, total, value, margin, marginPct };
}
